name: Dependabot

on:
  pull_request:
    branches: [main]
  # eslint-disable-next-line yml/no-empty-mapping-value -- GitHub Actions allows empty trigger events
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pin-versions:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install

      - name: Pin dependency versions
        run: bun run pin

      # bun install rewrites bun.lock even when package.json is already exact.
      # Dependabot pull_request runs use a read-only token, so pushing that
      # rewrite fails with git exit 128. Commit only when package.json changed.
      - name: Commit pinned versions
        id: pin
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json; then
            git checkout -- bun.lock
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock
          git commit --no-verify -m "chore(deps): pin dependency versions"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push pinned versions
        if: steps.pin.outputs.changed == 'true'
        run: git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
