name: Dependabot

on:
  pull_request:
    branches: [main]
  # eslint-disable-next-line yml/no-empty-mapping-value -- GitHub Actions allows empty trigger events
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pin-versions:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install

      - name: Pin dependency versions
        run: bun run pin

      - name: Regenerate lockfile for pinned manifest
        run: bun install

      - name: Verify lockfile matches manifest
        run: bun install --frozen-lockfile

      # bun install can rewrite bun.lock when versions are already exact.
      # A lockfile-only diff is discarded. A package.json change commits both
      # package.json and bun.lock so the lock matches the pins.
      - name: Commit pinned versions
        id: pin
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only -- package.json bun.lock)
          if [ "${#changed[@]}" -eq 0 ]; then
            action=$(bun scripts/pin-commit-plan.ts)
          else
            action=$(bun scripts/pin-commit-plan.ts "${changed[@]}")
          fi
          if [ "$action" = "none" ]; then
            if [ "${#changed[@]}" -gt 0 ]; then
              git checkout -- bun.lock
            fi
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock
          git commit --no-verify -m "chore(deps): pin dependency versions"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push pinned versions
        if: steps.pin.outputs.changed == 'true'
        run: git push origin "$(bun scripts/pin-commit-plan.ts --push-ref "${{ github.event.pull_request.head.ref }}")"
